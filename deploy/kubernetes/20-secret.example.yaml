# An EXAMPLE. Every value here is a placeholder and none of them is a
# credential. Apply your own, from whatever your cluster uses to hold secrets
# — this file exists to name the keys the deployment expects, not to carry
# their values.
#
#   kubectl -n code-review create secret generic ai-code-review-secrets \
#     --from-literal=GITLAB_TOKEN=... \
#     --from-literal=REVIEW_API_TOKEN=... \
#     --from-literal=GITLAB_WEBHOOK_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: ai-code-review-secrets
  namespace: code-review
  labels:
    app.kubernetes.io/name: ai-code-review
type: Opaque
stringData:
  # Reads merge requests and posts the review comment.
  GITLAB_TOKEN: "REPLACE_ME"
  # Every authenticated route compares against this. The service refuses to
  # start without one.
  REVIEW_API_TOKEN: "REPLACE_ME"
  # Compared against X-Gitlab-Token. Unset, the webhook refuses everything.
  GITLAB_WEBHOOK_SECRET: "REPLACE_ME"
