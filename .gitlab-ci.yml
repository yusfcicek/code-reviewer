# Pipeline for this repository.
#
# The `review` stage runs the agent against the merge request that triggered
# the pipeline: the job README tells other teams to copy is one this project
# actually runs on itself.

stages:
  - check
  - review

variables:
  UV_CACHE_DIR: .uv-cache
  PYTHON_VERSION: "3.12"

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --no-cache-dir uv
    - uv sync --frozen
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

lint:
  stage: check
  script:
    - uv run ruff check code_reviewer tests
    - uv run ruff format --check code_reviewer tests conftest.py

types:
  stage: check
  script:
    - uv run mypy

tests:
  stage: check
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# The agent reviewing this project's own merge requests.
#
# allow_failure is true while the agent is in alpha: a review that cannot run
# should not block a merge. Set it to false once the team trusts the verdict,
# and set `gate.fail_pipeline_on_critical` in review_policy.yaml to decide what
# "trust" means.
ai-code-review:
  stage: review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - uv run ai-code-review --project-id "$CI_PROJECT_ID" --mr-iid "$CI_MERGE_REQUEST_IID"
  artifacts:
    when: always
    reports:
      metrics: metrics.txt
    paths:
      - metrics.txt
    expire_in: 1 week
  allow_failure: true
