# Pipeline for this repository.
#
# The `review` stage runs the agent against the merge request that triggered
# the pipeline: the job README tells other teams to copy is one this project
# actually runs on itself.

stages:
  - check
  - review

variables:
  UV_CACHE_DIR: .uv-cache
  PYTHON_VERSION: "3.12"

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet --no-cache-dir uv
    - uv sync --frozen
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

lint:
  stage: check
  script:
    - uv run ruff check code_reviewer tests
    - uv run ruff format --check code_reviewer tests conftest.py

types:
  stage: check
  script:
    - uv run mypy

# A tool that reports other people's vulnerable dependencies has to measure its
# own. The script separates a real advisory from a failed connection to PyPI, so
# this can block without being a coin flip.
audit:
  stage: check
  script:
    - ./scripts/audit-deps.sh

tests:
  stage: check
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Review quality, measured rather than asserted.
#
# The floors are the measured baseline minus a margin (Level 12, decision D-4),
# applied to the lower bound of a 95 % interval rather than to the ratio (Level
# 25): an aspirational number would leave this red on day one and train everyone
# to skip it. Exit 1 means the analyzers got worse; exit 2 means the harness
# could not take the measurement, and the two must not be confused.
#
# Every number here is pinned to the constant the command uses by
# `tests/unit/test_ci_gates.py`, which reads both pipelines. It was written for
# the GitHub one and would have left this file drifting alone — the same
# incompleteness it exists to catch (self-review 28, S-01).
#
# The JSON artefact is the point of the job as much as the gate is: a number in
# a log is an anecdote, a number in an artefact is a series.
evaluate:
  stage: check
  script:
    - >
      uv run ai-code-review-eval
      --min-precision 0.80 --min-recall 0.80 --min-f1 0.80
      --json evaluation-summary.json
  artifacts:
    when: always
    paths:
      - evaluation-summary.json
    expire_in: 1 month

# The second measurement: what the model said, graded offline against the facts
# it was written about. No model endpoint is involved (Level 21).
evaluate-narration:
  stage: check
  script:
    - uv run ai-code-review-eval --narration --min-narration 0.85

# The third: whether a change is reported against the prose that described it
# (Level 23, measured by Level 27). It warns rather than blocks in the product;
# the corpus behind it is gated here.
evaluate-documentation:
  stage: check
  script:
    - >
      uv run ai-code-review-eval --documentation
      --min-precision 0.80 --min-recall 0.80 --min-f1 0.80

# The fourth: whether the document section a reader says relates to a change is
# retrieved at all. Level 28 earned this floor and no pipeline ran it
# (self-review 28, S-04).
evaluate-retrieval:
  stage: check
  script:
    - uv run ai-code-review-eval --retrieval --min-retrieval 0.50

# The fifth is not a score. It compares the prompt against the checks over its
# output, which is two texts and therefore has no floor to pass (Level 29).
evaluate-alignment:
  stage: check
  script:
    - uv run ai-code-review-eval --alignment

# The agent reviewing this project's own merge requests.
#
# allow_failure is true while the agent is in alpha: a review that cannot run
# should not block a merge. Set it to false once the team trusts the verdict,
# and set `gate.fail_pipeline_on_critical` in review_policy.yaml to decide what
# "trust" means.
ai-code-review:
  stage: review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - uv run ai-code-review --project-id "$CI_PROJECT_ID" --mr-iid "$CI_MERGE_REQUEST_IID"
  artifacts:
    when: always
    reports:
      metrics: metrics.txt
    paths:
      - metrics.txt
    expire_in: 1 week
  allow_failure: true
