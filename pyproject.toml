[project]
name = "enterprise-ai-code-reviewer"
version = "2.0.0"
description = "Enterprise-grade AI Code Review Agent with CI/CD integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Çiçek" }]
keywords = ["code-review", "static-analysis", "sast", "gitlab", "ci-cd", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "python-gitlab==4.4.0",
    "openai==1.12.0",
    "requests",
    "httpx",
    "langchain==0.1.0",
    "langchain-community==0.0.10",
    "PyYAML",
    "langchain-openai==0.0.2"
]

[project.urls]
Homepage = "https://github.com/yusfcicek/code-reviewer"
Repository = "https://github.com/yusfcicek/code-reviewer"
Issues = "https://github.com/yusfcicek/code-reviewer/issues"

[project.scripts]
ai-code-review = "code_reviewer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_reviewer"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest",
    "pytest-cov",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises more than one component together",
]

[tool.coverage.run]
source = ["code_reviewer"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-specific
]
ignore = [
    # The codebase documents itself partly in Turkish and uses typographic
    # dashes in prose. These three rules flag every non-ASCII character as
    # "ambiguous", which here means "correct".
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests build deliberately awkward inputs and assert on them; a few
# simplifications would obscure what is being exercised.
"tests/**" = ["SIM117", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["code_reviewer"]
