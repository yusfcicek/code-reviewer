name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  # A new push to the same ref supersedes the run in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, not `@v9`: setup-uv stopped publishing
      # major and minor tags at v8, deliberately, so that a compromised
      # upstream cannot move a tag under everybody's pipeline. `@v9` resolves
      # to nothing, which fails the job rather than silently using something
      # older — but the failure would read as a broken workflow, so the reason
      # is written here.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Still stated rather than left to the default, which is now `auto`.
          # What this pipeline wants is a cache, on every event.
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # Each check runs even if an earlier one failed, so one push produces the
      # whole list of problems rather than the first one.
      - name: Lint
        if: '!cancelled()'
        run: uv run ruff check code_reviewer tests

      - name: Formatting
        if: '!cancelled()'
        run: uv run ruff format --check code_reviewer tests conftest.py

      - name: Types
        if: '!cancelled()'
        run: uv run mypy

      - name: Tests
        if: '!cancelled()'
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      # A tool that reports other people's vulnerable dependencies has to
      # measure its own. The script separates a real advisory from a failed
      # connection to PyPI, so this can block without being a coin flip.
      - name: Audit dependencies
        if: '!cancelled()'
        run: ./scripts/audit-deps.sh

      # Review quality, measured rather than asserted. The floors are the
      # measured baseline minus a margin (Level 12, decision D-4), applied to
      # the lower bound of a 95 % interval rather than to the ratio (Level 25).
      #
      # Every number below is pinned to the constant the command itself uses by
      # `tests/unit/test_ci_gates.py`. Without that test the two drifted: Level
      # 25 changed what a floor means, these lines went on asking for the old
      # ones, and the two steps failed for four levels while four level reports
      # said they passed (self-review 28, S-01).
      - name: Evaluate review quality
        if: '!cancelled()'
        run: >
          uv run ai-code-review-eval
          --min-precision 0.80 --min-recall 0.80 --min-f1 0.80
          --json evaluation-summary.json

      # The second measurement: what the model *said*, graded offline against
      # the facts it was written about. No endpoint is involved (Level 21).
      - name: Evaluate narration quality
        if: '!cancelled()'
        run: uv run ai-code-review-eval --narration --min-narration 0.85

      # The third: whether a change is reported against the prose that
      # described it (Level 23, measured by Level 27). Warns rather than
      # blocks in the product; the corpus itself is gated here.
      - name: Evaluate documentation drift
        if: '!cancelled()'
        run: >
          uv run ai-code-review-eval --documentation
          --min-precision 0.80 --min-recall 0.80 --min-f1 0.80

      # The fourth: whether the section a reader says relates to a change is
      # retrieved at all. Level 28 earned this floor and CI never ran it
      # (self-review 28, S-04).
      - name: Evaluate drift retrieval
        if: '!cancelled()'
        run: uv run ai-code-review-eval --retrieval --min-retrieval 0.50

      # The fifth is not a score. It compares the prompt against the checks
      # over its output: a check with no instruction behind it grades the
      # model on a rule it was never given, and a heading nothing grades is
      # output nobody looks at. Two texts, so there is no floor to pass
      # (Level 29).
      - name: Check the prompt against its checks
        if: '!cancelled()'
        run: uv run ai-code-review-eval --alignment

      - name: Upload evaluation summary
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-summary
          path: evaluation-summary.json
          if-no-files-found: ignore

      # The image is built, not pushed. Where it goes and what deploys it are
      # decisions belonging to whoever operates it; that it *builds* is a
      # property of this repository (Level 19).
      - name: Build the container image
        if: '!cancelled()'
        run: docker build --tag ai-code-review:ci .

      - name: Upload coverage
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
