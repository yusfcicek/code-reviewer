# Two credentials in module scope. The `Authorization` header interpolates the
# constant rather than declaring a second one, which is the case that separates
# "a secret is here" from "the word key appears here".
name: hardcoded-secret
file: fixtures/hardcoded_secret.py
scope: ["SAST.*"]
expect:
  - rule: SAST.HARDCODED_SECRET
    line: 5
    severity: high
  - rule: SAST.HARDCODED_SECRET
    line: 6
    severity: high
