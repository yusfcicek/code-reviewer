# The only rule that needs a diff: a parameter removed from a public function.
#
# The scope is one rule rather than `SEMANTIC.*`, because the suite also reports
# `SEMANTIC.UNREFERENCED_IN_FILE` on this fixture — a module's only public
# function is not called inside its own module, which is normal. Whether that
# rule is noise is a judgement this level does not make, so it is left ungraded
# and shows up in the report's ungraded count rather than being silently
# dropped.
name: breaking-change
file: fixtures/breaking_change.py
diff: fixtures/breaking_change.diff
scope: ["SEMANTIC.BREAKING_CHANGE"]
expect:
  - rule: SEMANTIC.BREAKING_CHANGE
    line: 4
    severity: high
