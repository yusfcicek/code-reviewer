# The false positive that made the first implementation unusable. `hashlib.md5`
# is a real function in a library this tree does not define, and it looks
# exactly like a symbol the project lost.
name: library-call-is-not-dead
index:
  names: [create_app, Renderer, Renderer.render, MAX_LINES]
  signatures:
    create_app: [config, worker]
    Renderer.render: [version]
  options: ["--strict"]
  environment: [CI_PROJECT_ID]
changes:
  - path: app.py
    diff: |
      @@ -1,3 +1,2 @@
      -def start_app(config):
      -    return config
       x = 1
documents:
  README.md: |
    # Guide

    Do not use `hashlib.md5`; prefer `yaml.safe_load` over `yaml.load`.
    A `ConfigMap` is applied by the chart.
expected: []
forbidden:
  - rule: DOCS.DEAD_REFERENCE
