# The user's own example: a function's parameters change and the README does
# not. Graded because the change touched the symbol.
name: signature-mismatch
index:
  names: [create_app, Renderer, Renderer.render, MAX_LINES]
  signatures:
    create_app: [config, worker]
    Renderer.render: [version]
  options: ["--strict"]
  environment: [CI_PROJECT_ID]
changes:
  - path: app.py
    diff: |
      @@ -1,2 +1,2 @@
      -def create_app(config):
      +def create_app(config, worker):
documents:
  README.md: |
    # Guide

    Call `create_app(config)` at boot.
expected:
  - rule: DOCS.SIGNATURE_MISMATCH
    line: 3
