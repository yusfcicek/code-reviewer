# DOCSTRING_DRIFT had one case. This is the shape the self-review of levels
# 12-20 actually found in this repository.
name: docstring-documents-a-vanished-parameter
index:
  names: [create_app, Renderer, Renderer.render, MAX_LINES, drain]
  signatures:
    create_app: [config, worker]
    Renderer.render: [version]
    drain: [worker, seconds]
  options: ["--strict"]
  environment: [CI_PROJECT_ID]
changes:
  - path: render.py
    diff: |
      @@ -1,1 +1,2 @@
       x = 1
      +y = 2
sources:
  render.py: |
    def render(version):
        """Renders it.

        Args:
            version: the policy version.
            outcome: removed two releases ago.
        """
        return version
expected:
  - rule: DOCS.DOCSTRING_DRIFT
    line: 1
