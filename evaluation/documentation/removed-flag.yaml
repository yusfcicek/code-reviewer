# The option half of a dead reference: the change deleted the flag, the
# document still documents it.
name: removed-flag
index:
  names: [create_app, Renderer, Renderer.render, MAX_LINES]
  signatures:
    create_app: [config, worker]
    Renderer.render: [version]
  options: ["--strict"]
  environment: [CI_PROJECT_ID]
changes:
  - path: cli.py
    diff: |
      @@ -1,2 +1,1 @@
      -    parser.add_argument("--legacy", action="store_true")
documents:
  README.md: |
    # Options

    Pass `--legacy` for the old behaviour, or `--strict` to fail on warnings.
expected:
  - rule: DOCS.UNKNOWN_OPTION
    line: 3
