# The scope rule, stated as a case: the change touched nothing this document
# talks about, so the document is not examined.
name: untouched-signature
index:
  names: [create_app, Renderer, Renderer.render, MAX_LINES]
  signatures:
    create_app: [config, worker]
    Renderer.render: [version]
  options: ["--strict"]
  environment: [CI_PROJECT_ID]
changes:
  - path: other.py
    diff: |
      @@ -1,1 +1,2 @@
       x = 1
      +y = 2
documents:
  README.md: |
    # Guide

    Call `create_app(config)` at boot.
expected: []
forbidden:
  - rule: DOCS.SIGNATURE_MISMATCH
