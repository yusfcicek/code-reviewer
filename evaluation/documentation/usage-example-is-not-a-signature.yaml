# A document showing somebody how to call a function is not a document
# stating its parameter names.
name: usage-example-is-not-a-signature
index:
  names: [create_app, Renderer, Renderer.render, MAX_LINES]
  signatures:
    create_app: [config, worker]
    Renderer.render: [version]
  options: ["--strict"]
  environment: [CI_PROJECT_ID]
changes:
  - path: app.py
    diff: |
      @@ -1,2 +1,2 @@
      -def create_app(config):
      +def create_app(config, worker):
documents:
  README.md: |
    # Guide

    For example: `create_app("settings.yaml", 4)`.
expected: []
forbidden:
  - rule: DOCS.SIGNATURE_MISMATCH
