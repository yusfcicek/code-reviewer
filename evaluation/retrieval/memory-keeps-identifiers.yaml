documents:
  docs/memory.md: |
    # Project memory

    ## What is remembered between runs

    Only identifiers: a rule, a file, how often it came back, when it was last
    seen. Never the code itself, so a history that leaks is a history of names.

    ## Forgetting

    Old entries fall away by age and by salience.
