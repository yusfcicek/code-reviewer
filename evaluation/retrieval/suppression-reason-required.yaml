name: suppression-reason-required
because: >-
  The section explains that a silenced rule needs a written reason. The
  change adds exactly that requirement and never uses the word 'suppression'
  in the diff.
expect:
  path: docs/guide.md
  heading: Silencing a rule
diff: |
  @@ -12,6 +12,9 @@
       def apply(self, directives):
  -        return [d for d in directives]
  +        for directive in directives:
  +            if not directive.reason:
  +                raise ValueError("a rule quieted with no reason recorded is a rule nobody can audit")
  +        return list(directives)

documents:
  docs/guide.md: |
    # Guide

    ## Silencing a rule

    A directive next to a line quiets one rule there, and the written reason is
    what the next person reads instead of re-deriving the judgement. Nothing is
    quieted without one being recorded.

    ## Retrieval

    Chunks are scored twice and fused by rank.
  docs/operations.md: |
    # Operations
    
    ## Running the service
    
    A worker claims the oldest queued job and moves it to running. Nothing blocks
    inside the store, because a worker that waits there cannot be told to stop.
    
    ## Configuration
    
    Every setting is read from the environment once at start-up and logged by name,
    never by value.
    
    ## Deploying
    
    The chart applies a config map, a deployment and a horizontal autoscaler. A
    rollout that cannot pull its image fails closed.
    
    ## Metrics
    
    Counts, durations and token use, exported for scraping. None of it says whether
    a review was any good.
    
    ## Troubleshooting
    
    A run that produced no comment either found nothing to review or could not reach
    the forge, and the exit code tells you which.
    
    ## Upgrading
    
    Read the changelog. Two entries have moved a floor, and a floor that moved is a
    claim that changed.
