name: memory-where-it-lives
because: >-
  The change moves the file the history is written to, which is what the
  section tells a team.
expect:
  path: docs/memory.md
  heading: Where it is kept
diff: |
  @@ -14,2 +14,2 @@
  -    return workspace.root / ".review-history.json"
  +    return workspace.root / ".ai-review" / "history.json"
documents:
  docs/memory.md: |
    # Project memory

    ## What is remembered between runs

    Only identifiers: a rule, a file, how often it came back, when it was last seen.

    ## Forgetting

    Old entries fall away by age and by salience.

    ## Where it is kept

    A file beside the checkout, so a team can see it, commit it or delete it.
  docs/operations.md: |
    # Operations
    
    ## Running the service
    
    A worker claims the oldest queued job and moves it to running. Nothing blocks
    inside the store, because a worker that waits there cannot be told to stop.
    
    ## Configuration
    
    Every setting is read from the environment once at start-up and logged by name,
    never by value.
    
    ## Deploying
    
    The chart applies a config map, a deployment and a horizontal autoscaler. A
    rollout that cannot pull its image fails closed.
    
    ## Metrics
    
    Counts, durations and token use, exported for scraping. None of it says whether
    a review was any good.
    
    ## Troubleshooting
    
    A run that produced no comment either found nothing to review or could not reach
    the forge, and the exit code tells you which.
    
    ## Upgrading
    
    Read the changelog. Two entries have moved a floor, and a floor that moved is a
    claim that changed.
